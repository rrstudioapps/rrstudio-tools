name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04 # Playwright 1.59 non supporta ancora Chromium su ubuntu 26.04 (ubuntu-latest)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Chromium for the browser tests
        run: npx playwright-core install --with-deps chromium
      - name: Smoke test (all pages, console, overflow, axe)
        run: npm run smoke
      - name: E2E (tool interactions)
        run: npm run e2e
      - name: Check prerendered pages
        run: |
          test -f dist/rrstudio-tools/browser/index.html
          test -f dist/rrstudio-tools/browser/csv-dashboard/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: rrstudio-tools-static
          path: dist/rrstudio-tools/browser
          retention-days: 14
