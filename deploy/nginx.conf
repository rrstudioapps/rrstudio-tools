#
# Sito statico prerenderizzato. Le intestazioni di sicurezza fanno rispettare anche lato
# browser la regola "nessuna chiamata a server esterni" (connect-src 'self').

# Web Share Target: il manifest fa inviare il contenuto condiviso con un POST a /condividi/. Lo prende il service
# worker (il POST non arriva in rete). Se il worker non è attivo (prima visita, cache svuotata, browser senza worker)
# la richiesta arriva qui: invece di un errore 405 si rimanda con un 303 alla pagina di ricezione, che invita a
# riprovare. La lingua segue la prima preferenza di Accept-Language (come nel service worker).
map "$request_method:$http_accept_language" $share_retry {
    default "";
    "~^POST:en([-,;]|$)" /en/share/?retry=1;
    "~^POST:" /condividi/?retry=1;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # niente log degli accessi qui: li registra già il reverse proxy davanti (con la sua rotazione),
    # un secondo registro sarebbe solo una copia dei dati tenuta più a lungo. Gli errori restano.
    access_log off;

    # file temporanei in /tmp (il container è read_only, /tmp è un tmpfs)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/csv;

    # nota: gli add_header vanno ripetuti in ogni location (nginx non li eredita)

    # pagina di ricezione dei contenuti condivisi: una GET serve la pagina; un POST (condivisione arrivata senza
    # service worker) riceve subito un 303 senza leggere il corpo. client_max_body_size 50m serve
    # perché nginx controlla la dimensione dichiarata PRIMA del redirect e risponderebbe 413 a un file più grande: il
    # corpo non viene mai letto né salvato (il container resta read_only). Intestazioni di sicurezza identiche alle altre pagine.
    location = /condividi/ {
        client_max_body_size 50m;
        absolute_redirect off;
        if ($share_retry) {
            return 303 $share_retry;
        }
        try_files /condividi/index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # pagine prerenderizzate: /csv-dashboard -> /csv-dashboard/index.html
    location / {
        try_files $uri $uri/index.html $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # versione inglese: un indirizzo /en/... sconosciuto ripiega sulla home inglese, non su quella italiana
    location /en/ {
        try_files $uri $uri/index.html $uri/ /en/index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # CSV di esempio: nginx non conosce il tipo .csv e lo servirebbe come octet-stream
    location /samples/ {
        types { text/csv csv; }
        charset utf-8;
        charset_types text/csv;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # worker di pdf.js (strumenti PDF): i moduli ES vanno serviti come JavaScript, altrimenti il browser li rifiuta
    location /pdfjs/ {
        types { text/javascript mjs; }
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # service worker e manifest: sempre rivalidati, così un aggiornamento arriva subito.
    # (Service-Worker-Allowed non serve: sw.js sta nella radice e il suo scope è già "/")
    location = /sw.js {
        types { text/javascript js; }
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # file con hash nel nome: cache lunga
    location ~* "-[A-Z0-9]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
