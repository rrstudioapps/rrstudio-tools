<header class="bar">
  <div class="container bar-inner">
    <a class="brand" [routerLink]="i18n.link('')" [attr.aria-label]="'rrstudio Tools — ' + i18n.t('nav.home')">
      <img src="favicon.svg" alt="" width="28" height="28" />
      <span class="name">rrstudio <span class="sub">Tools</span></span>
    </a>

    <nav class="nav" [attr.aria-label]="i18n.t('nav.main')">
      <a class="nav-link" [routerLink]="i18n.link('')" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">{{
        i18n.t('nav.home')
      }}</a>
    </nav>

    <div class="actions">
      <div class="lang" role="group" [attr.aria-label]="i18n.t('nav.lang')">
        @for (l of langs; track l) {
          @if (l === i18n.lang()) {
            <span class="lang-btn on" aria-current="true" [attr.lang]="l">{{ l.toUpperCase() }}</span>
          } @else if (i18n.otherPath(); as target) {
            <a class="lang-btn" [routerLink]="target" [attr.lang]="l" [attr.hreflang]="l">{{ l.toUpperCase() }}</a>
          } @else {
            <!-- strumento solo italiano: la versione inglese non esiste, il pulsante resta spento -->
            <span class="lang-btn off" lang="en" aria-disabled="true" title="Italian only: no English version">{{
              l.toUpperCase()
            }}</span>
          }
        }
      </div>
      <button
        type="button"
        class="icon-btn"
        [attr.aria-label]="theme.isDark() ? i18n.t('nav.theme.toLight') : i18n.t('nav.theme.toDark')"
        [attr.title]="theme.isDark() ? i18n.t('nav.theme.toLight') : i18n.t('nav.theme.toDark')"
        (click)="theme.toggle()"
      >
        <app-icon [name]="theme.isDark() ? 'sun' : 'moon'" [stroke]="1.6" />
      </button>
    </div>
  </div>
</header>
